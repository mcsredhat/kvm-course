---
- name: Deploy KVM lab from code
  hosts: kvmhost
  become: true
  tasks:
    - name: Install tooling
      ansible.builtin.dnf:
        name: [xorriso, qemu-img, python3-libvirt, python3-lxml, libvirt-client]
        state: present

    - name: List existing domains
      ansible.builtin.command: virsh list --all --name
      environment:
        LIBVIRT_DEFAULT_URI: qemu:///system
      register: existing
      changed_when: false

    - name: Build each VM
      ansible.builtin.include_tasks: vm.yml
      loop: "{{ vms }}"
      loop_control:
        loop_var: vm
